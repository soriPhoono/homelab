version: "3.9"
services:
  n8n:
    image: n8nio/n8n:2.39.6
    environment:
      GENERIC_TIMEZONE: America/Chicago
      N8N_EDITOR_BASE_URL: https://agents.cryptic-coders.net/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: agents.cryptic-coders.net
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_TIMEOUT: "14400"
      N8N_NATIVE_PYTHON_RUNNER: "true"
      # File nodes may only touch the folder shared with the runners, and
      # multi-GB downloads spill to disk instead of the 2G memory limit.
      N8N_RESTRICT_FILE_ACCESS_TO: /data/vods
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      NODE_ENV: production
      TZ: America/Chicago
      WEBHOOK_URL: https://agents.cryptic-coders.net/
    networks:
      - n8n
    secrets:
      - n8n_runners_auth_token
    volumes:
      - n8n_data:/home/node/.n8n
      - /srv/n8n/vods:/data/vods
    deploy:
      placement:
        constraints:
          - node.hostname == sphoono-vps
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: any
        delay: 5s
  runners:
    # Built from docker/images/n8n-runners: adds ffmpeg and the Python
    # stdlib allowlist the render code needs.
    image: ghcr.io/soriphoono/n8n-runners:2.39.6-ffmpeg9.0.2
    environment:
      N8N_RUNNERS_AUTH_TOKEN_FILE: /run/secrets/n8n_runners_auth_token
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # Renders take roughly as long as the footage.
      N8N_RUNNERS_TASK_TIMEOUT: "14400"
    networks:
      - n8n
    secrets:
      - n8n_runners_auth_token
    volumes:
      - /srv/n8n/vods:/data/vods
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.hostname == sphoono-vps
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: any
        delay: 5s
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflared_tunnel_token
    networks:
      - n8n
    secrets:
      - cloudflared_tunnel_token
    deploy:
      placement:
        constraints:
          - node.hostname == sphoono-vps
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
networks:
  n8n:
    driver: overlay
volumes:
  n8n_data:
secrets:
  cloudflared_tunnel_token:
    file: ./secrets/cloudflared-tunnel-token
  n8n_runners_auth_token:
    file: ./secrets/n8n-runners-auth-token
