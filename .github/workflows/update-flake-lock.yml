# This file is automatically generated from Nix configuration. Do not edit directly.
concurrency:
  cancel-in-progress: true
  group: update-flake-lock
jobs:
  update-flake-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3.17.3
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-labels: |-
            dependencies
            automated
          pr-title: "chore(deps): update flake.lock"
          token: ${{ github.token }}
name: Update flake.lock
"on":
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write
