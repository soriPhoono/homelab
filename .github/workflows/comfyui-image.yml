# --- Build and publish the ComfyUI ROCm image (ROCm PyTorch base + ComfyUI)
name: comfyui image

on:
  workflow_dispatch: # allows manual triggering from the Actions UI
  push:
    branches:
      - main
    paths:
      - docker/images/comfyui/**
      - .github/workflows/comfyui-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Freeing runner disk space..."
        run: |
          # The ROCm PyTorch base layers exceed the default free disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: "Checking out repository..."
        uses: actions/checkout@v4
      - name: "Reading versions from the Dockerfile..."
        id: version
        run: |
          dockerfile=docker/images/comfyui/Dockerfile
          comfyui=$(sed -n 's/^ARG COMFYUI_VERSION=//p' "$dockerfile")
          rocm=$(sed -n 's/^ARG ROCM_PYTORCH_TAG=\(rocm[^_]*\)_.*/\1/p' "$dockerfile")
          echo "tag=${comfyui}-${rocm}" >> "$GITHUB_OUTPUT"
      - name: "Setting up Buildx..."
        uses: docker/setup-buildx-action@v3
      - name: "Logging in to GHCR..."
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Building and pushing..."
        uses: docker/build-push-action@v6
        with:
          context: docker/images/comfyui
          push: true
          tags: ghcr.io/soriphoono/comfyui-rocm:${{ steps.version.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/soriPhoono/homelab
