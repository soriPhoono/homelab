  - path_regex: secrets/host-desktop-ares.yaml$
    key_groups:
      - age:
          - *user-sphoono
          - *desktop-ares
  - path_regex: secrets/host-workstation-ares.yaml$
    key_groups:
      - age:
          - *user-sphoono
          - *workstation-ares
  - path_regex: secrets/user-spookyskelly.yaml$
    key_groups:
      - age:
          - *user-sphoono
          - *user-spookyskelly
  - path_regex: secrets/host-laptop-vesper.yaml$
